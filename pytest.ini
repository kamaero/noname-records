[pytest]
# passlib 1.7.4 (latest release) imports the stdlib `crypt` module, deprecated in Python
# 3.11 and slated for removal in 3.13. It's a warning from inside passlib, not our code, and
# there is no newer passlib release that fixes it. We're on Python 3.12 (unaffected at runtime).
# MUST replace passlib (e.g. pwdlib/argon2) before moving to Python 3.13.
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal in Python 3.13:DeprecationWarning
markers =
    elevenlabs_transport: тест проверяет настоящий транспорт ElevenLabs с подменённым urlopen (снимает сторож conftest)
